name: Build Newifi D2 Firmware

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "源码分支（openwrt-21.02 = iptables 全兼容；openwrt-24.10 = 新内核）"
        required: true
        default: "openwrt-21.02"
        type: choice
        options:
          - openwrt-21.02
          - openwrt-23.05
          - openwrt-24.10
      config_file:
        description: "配置文件路径"
        required: true
        default: "configs/d2.config"

env:
  REPO_URL: https://github.com/immortalwrt/immortalwrt
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    steps:
      - name: 检出本仓库
        uses: actions/checkout@v4

      - name: 安装编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get -qq install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev libelf-dev \
            python3-setuptools python3-dev python3-distutils rsync swig \
            unzip zlib1g-dev file wget subversion
          sudo -E apt-get -qq install -y ecj fastjar java-propose-classpath \
            || echo "WARN: 部分可选 Java 工具不可用，不影响主流程"
          sudo -E apt-get -qq clean
          sudo timedatectl set-timezone "$TZ"
          sudo mkdir -p /workdir
          sudo chown "$USER:$GROUPS" /workdir
          echo "CPU: $(nproc) 核 / 磁盘:" && df -h /workdir | tail -1

      - name: 克隆 ImmortalWrt 源码
        working-directory: /workdir
        run: |
          BRANCH="${{ github.event.inputs.branch || 'openwrt-21.02' }}"
          echo "SYNC_BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git clone --depth=1 -b "$BRANCH" "$REPO_URL" openwrt
          cd openwrt && git log -1 --format='%h %s (%cd)' --date=short

      - name: 缓存编译下载目录
        uses: actions/cache@v4
        with:
          path: /workdir/openwrt/dl
          key: dl-${{ github.event.inputs.branch || 'openwrt-21.02' }}-${{ hashFiles('configs/*.config', 'scripts/diy-part*.sh') }}
          restore-keys: |
            dl-${{ github.event.inputs.branch || 'openwrt-21.02' }}-

      - name: 更新 feeds
        run: |
          cd /workdir/openwrt
          sed -i 's/\r$//' "$GITHUB_WORKSPACE"/scripts/*.sh
          ./scripts/feeds update -a
          chmod +x "$GITHUB_WORKSPACE"/scripts/diy-part1.sh
          "$GITHUB_WORKSPACE"/scripts/diy-part1.sh
          ./scripts/feeds install -a

      - name: 应用配置
        run: |
          cd /workdir/openwrt
          CFG="$GITHUB_WORKSPACE/${{ github.event.inputs.config_file || 'configs/d2.config' }}"
          [ -f "$CFG" ] || { echo "配置不存在: $CFG"; exit 1; }
          cp "$CFG" .config
          make defconfig
          chmod +x "$GITHUB_WORKSPACE"/scripts/diy-part2.sh
          "$GITHUB_WORKSPACE"/scripts/diy-part2.sh
          make defconfig
          echo "======== 关键选项核对 ========"
          grep -qE "^CONFIG_TARGET_ramips_mt7621_DEVICE_d-team_newifi-d2=y" .config \
            && echo "OK  目标设备: d-team_newifi-d2" || { echo "FAIL 目标设备未命中"; exit 1; }
          for p in luci-app-upnp kmod-tun tc-full kmod-ipt-tproxy; do
            grep -qE "^CONFIG_PACKAGE_${p}=y" .config && echo "OK  $p" || echo "WARN $p 未启用"
          done

      - name: 下载依赖源码包
        run: |
          cd /workdir/openwrt
          make download -j8 2>&1 | tail -n 20
          find dl -size -1024c -type f -exec rm -f {} \;

      - name: 开始编译
        run: |
          cd /workdir/openwrt
          echo "使用 $(nproc) 线程编译，日志写入 build.log"
          if ! make -j"$(nproc)" > /workdir/build.log 2>&1; then
            echo "==== 多线程失败，打印最后 120 行 ===="
            tail -n 120 /workdir/build.log
            echo "==== 单线程重试（定位具体错误） ===="
            make -j1 V=s 2>&1 | tail -n 120
            exit 1
          fi
          echo "编译成功"

      - name: 收集产物
        run: |
          cd /workdir/openwrt/bin/targets/ramips/mt7621
          ls -lh
          mkdir -p /workdir/artifacts
          STAMP="$(date +%Y%m%d)-${SYNC_BRANCH}"
          for f in *squashfs-sysupgrade.bin; do
            [ -f "$f" ] || continue
            cp -v "$f" "/workdir/artifacts/newifi-d2-${STAMP}-sysupgrade.bin"
          done
          for f in *initramfs-kernel.bin; do
            [ -f "$f" ] || continue
            cp -v "$f" "/workdir/artifacts/newifi-d2-${STAMP}-initramfs.bin"
          done
          cd /workdir/artifacts
          sha256sum ./*.bin > SHA256SUMS.txt 2>/dev/null || true
          {
            echo "构建时间: $(TZ=$TZ date '+%Y-%m-%d %H:%M:%S')"
            echo "源码分支: ${SYNC_BRANCH}"
            echo "目标设备: d-team_newifi-d2 (ramips/mt7621)"
            echo "配置文件: ${{ github.event.inputs.config_file || 'configs/d2.config' }}"
            echo "--- 产物 ---"
            ls -lh ./*.bin 2>/dev/null
          } > MANIFEST.txt
          cat MANIFEST.txt

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: newifi-d2-${{ github.event.inputs.branch || 'openwrt-21.02' }}
          path: /workdir/artifacts/*
          retention-days: 30

      - name: 失败时保存日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-failed
          path: /workdir/build.log
          retention-days: 7
